spring:
  application:
    name: flowpilot
  datasource:
    url: ${FLOWPILOT_DB_URL:jdbc:mysql://localhost:3306/flowpilot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${FLOWPILOT_DB_USERNAME:root}
    password: ${FLOWPILOT_DB_PASSWORD:}
  sql:
    init:
      mode: never
      schema-locations: classpath:db/schema.sql
  flyway:
    enabled: true
    locations: classpath:db/migration

flowpilot:
  security:
    require-role: ${FLOWPILOT_SECURITY_REQUIRE_ROLE:false}
  gray:
    protection:
      failure-threshold: ${FLOWPILOT_GRAY_FAILURE_THRESHOLD:5}
  execution:
    retention-days: ${FLOWPILOT_EXECUTION_RETENTION_DAYS:30}
    retention-batch-size: ${FLOWPILOT_EXECUTION_RETENTION_BATCH_SIZE:1000}
    max-concurrency: ${FLOWPILOT_EXECUTION_MAX_CONCURRENCY:256}
    admission-timeout-ms: ${FLOWPILOT_EXECUTION_ADMISSION_TIMEOUT_MS:1000}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
  endpoint:
    health:
      show-details: when_authorized
